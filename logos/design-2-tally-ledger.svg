<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tallyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002b49" />
      <stop offset="50%" stop-color="#001a2e" />
      <stop offset="100%" stop-color="#000e1a" />
    </linearGradient>
    <linearGradient id="tallyYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff066" />
      <stop offset="50%" stop-color="#ffcc00" />
      <stop offset="100%" stop-color="#e6a800" />
    </linearGradient>
    <linearGradient id="tallyTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="tallyDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#ffcc00" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#tallyBg)" />
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="#ffcc00" stroke-opacity="0.3" stroke-width="3" />

  <!-- Tally Style Double-Entry Open Ledger Book -->
  <g filter="url(#tallyDrop)">
    <!-- Left Page (Debit - Tally Blue) -->
    <path d="M256 140 C190 125, 130 135, 100 155 L100 365 C130 345, 190 335, 256 350 Z" 
          fill="#003e66" stroke="url(#tallyTeal)" stroke-width="6" />
    
    <!-- Right Page (Credit - Tally Yellow/Gold) -->
    <path d="M256 140 C322 125, 382 135, 412 155 L412 365 C382 345, 322 335, 256 350 Z" 
          fill="url(#tallyYellow)" stroke="#ffe066" stroke-width="6" />

    <!-- Center Book Spine Binding -->
    <rect x="250" y="130" width="12" height="235" rx="6" fill="#ffffff" />

    <!-- Tally ERP Style Chevron Arrows (Sync Cycle) -->
    <!-- Top Left to Right Arrow -->
    <path d="M150 95 L256 70 L256 95 L170 115 Z" fill="url(#tallyYellow)" />
    <!-- Bottom Right to Left Arrow -->
    <path d="M362 415 L256 440 L256 415 L342 395 Z" fill="url(#tallyTeal)" />

    <!-- PROMINENT RUPEE (₹) ON LEFT PAGE -->
    <text x="178" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="110" font-weight="900" fill="#38bdf8">₹</text>

    <!-- CLASSIC TALLY 'T' ON RIGHT PAGE -->
    <text x="334" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="110" font-weight="900" fill="#002b49">T</text>

    <!-- Ledger Entry Lines -->
    <line x1="130" y1="310" x2="225" y2="310" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
    <line x1="287" y1="310" x2="382" y2="310" stroke="#002b49" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
