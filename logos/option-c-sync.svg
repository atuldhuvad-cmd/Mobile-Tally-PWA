<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="70%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="goldGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="tealGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glowC" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGradC)" />
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="3" />

  <!-- Central Tally Book Outline -->
  <g filter="url(#glowC)">
    <!-- Outer Arch & Sync Orbit -->
    <path d="M120 256 A136 136 0 0 1 392 256" fill="none" stroke="url(#goldGradC)" stroke-width="12" stroke-linecap="round" stroke-dasharray="16 12" />
    <path d="M392 256 A136 136 0 0 1 120 256" fill="none" stroke="url(#tealGradC)" stroke-width="12" stroke-linecap="round" />

    <!-- Left Debit Node -->
    <circle cx="120" cy="256" r="28" fill="#1c1917" stroke="url(#goldGradC)" stroke-width="8" />
    <text x="120" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#fde047">Dr</text>

    <!-- Right Credit Node -->
    <circle cx="392" cy="256" r="28" fill="#1c1917" stroke="url(#tealGradC)" stroke-width="8" />
    <text x="392" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#34d399">Cr</text>

    <!-- Central Mobile Tally Device / Ledger Core -->
    <rect x="200" y="150" width="112" height="212" rx="24" fill="#1c1917" stroke="url(#goldGradC)" stroke-width="8" />
    <rect x="216" y="176" width="80" height="135" rx="12" fill="#292524" />
    
    <!-- Screen Tally Balance Lines -->
    <line x1="228" y1="205" x2="284" y2="205" stroke="#fde047" stroke-width="6" stroke-linecap="round" />
    <line x1="228" y1="230" x2="284" y2="230" stroke="#fde047" stroke-width="6" stroke-linecap="round" />
    <line x1="228" y1="255" x2="265" y2="255" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
    <line x1="228" y1="280" x2="284" y2="280" stroke="#fde047" stroke-width="6" stroke-linecap="round" />

    <!-- Home Button / Biometric Ring -->
    <circle cx="256" cy="336" r="9" fill="none" stroke="#f59e0b" stroke-width="4" />
  </g>

  <!-- Subtitle Tag -->
  <text x="256" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="4" fill="#f59e0b">MOBILE TALLY</text>
</svg>
