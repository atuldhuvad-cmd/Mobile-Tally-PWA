<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emeraldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#011610" />
    </linearGradient>
    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="30%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="mintNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="emeraldDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#emeraldBg)" />
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="url(#champagneGold)" stroke-opacity="0.35" stroke-width="3" />

  <!-- Circular Vault & Flourishing Ledger Leaf Emblem -->
  <g filter="url(#emeraldDrop)">
    <!-- Outer Vault Ring -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#champagneGold)" stroke-width="10" />
    <circle cx="256" cy="256" r="140" fill="#022c22" stroke="url(#mintNeon)" stroke-width="4" stroke-dasharray="12 8" />

    <!-- Stylized Rupee (₹) & Ledger Sync Fusion -->
    <!-- Top Horizontal Bar -->
    <path d="M180 180 L332 180" stroke="url(#champagneGold)" stroke-width="16" stroke-linecap="round" />
    <!-- Middle Horizontal Bar -->
    <path d="M180 220 L300 220" stroke="url(#champagneGold)" stroke-width="16" stroke-linecap="round" />
    
    <!-- Curved 'R' Loop & Downward Dynamic Growth Slash -->
    <path d="M220 180 L220 340" stroke="url(#champagneGold)" stroke-width="16" stroke-linecap="round" />
    <path d="M220 220 C290 220, 290 280, 220 280" fill="none" stroke="url(#champagneGold)" stroke-width="16" stroke-linecap="round" />
    <path d="M245 275 L325 345" stroke="url(#mintNeon)" stroke-width="18" stroke-linecap="round" />

    <!-- Prosperity Sync Nodes -->
    <circle cx="332" cy="180" r="10" fill="#fef9c3" />
    <circle cx="325" cy="345" r="12" fill="#a7f3d0" />
  </g>
</svg>
