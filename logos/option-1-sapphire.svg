<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sapphireBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="platGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="sapphireDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#38bdf8" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#sapphireBg)" />
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="3" />

  <!-- Geometric Isometric Crystal Ledger & Financial Growth Crest -->
  <g filter="url(#sapphireDrop)">
    <!-- Outer Shield Halo Ring -->
    <path d="M256 90 L390 160 L390 320 L256 410 L122 320 L122 160 Z" 
          fill="none" stroke="url(#cyanGlow)" stroke-width="8" stroke-linejoin="round" />

    <!-- Left Crystal Facet (Debit) -->
    <path d="M256 160 L160 210 L160 330 L256 380 Z" fill="url(#cyanGlow)" opacity="0.9" />

    <!-- Right Crystal Facet (Credit / Platinum Page) -->
    <path d="M256 160 L352 210 L352 330 L256 380 Z" fill="url(#platGrad)" />

    <!-- Center Spine Line -->
    <line x1="256" y1="160" x2="256" y2="380" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />

    <!-- Top Floating Diamond Star (Precision) -->
    <polygon points="256,100 270,125 256,150 242,125" fill="#ffffff" />
    
    <!-- Balance Bars on Platinum Page -->
    <line x1="280" y1="230" x2="330" y2="210" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
    <line x1="280" y1="260" x2="330" y2="240" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
    <line x1="280" y1="290" x2="330" y2="270" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />

    <!-- Balance Bars on Cyan Page -->
    <line x1="182" y1="210" x2="232" y2="230" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <line x1="182" y1="240" x2="232" y2="260" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <line x1="182" y1="270" x2="232" y2="290" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
